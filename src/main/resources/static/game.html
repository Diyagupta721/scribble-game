<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scribble — Game</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/game.css">
</head>

<body>

<script>
  // Debug logging is disabled for the production UI.
  // Keep this function because existing game code calls it.
  window.scribbleDebugLog = function () {};
</script>

<div class="bg-scene"></div>

<div id="toast-stack"></div>

<div class="page-loader" id="page-loader">
  <div class="spinner"></div>
</div>


<div class="game-shell hidden" id="game-shell">

  <!-- ================= HUD ================= -->
  <header class="hud">
    <div class="hud-brand">🎨 <span>SCRIBBLE</span></div>

    <div class="hud-round" id="hud-round">
      Round 1/3
    </div>

    <div class="hud-timer" id="hud-timer">
      <svg viewBox="0 0 44 44" class="timer-ring">
        <circle
                cx="22"
                cy="22"
                r="19"
                class="timer-ring-bg"
        />

        <circle
                cx="22"
                cy="22"
                r="19"
                class="timer-ring-fg"
                id="timer-ring-fg"
        />
      </svg>

      <span id="timer-value">--</span>
    </div>

    <button
            class="hud-scores-btn btn-icon"
            id="btn-toggle-players"
            title="Players & scores"
    >
      🏆
    </button>

    <button
            class="btn btn-ghost"
            id="btn-leave-game"
            title="Leave game"
    >
      Leave Game
    </button>
  </header>


  <!-- ================= WORD BAR ================= -->
  <div class="word-bar" id="word-bar">
    <span id="word-bar-text">
      Waiting for the round to start…
    </span>
  </div>


  <div class="game-grid">

    <!-- ================= PLAYERS / SCOREBOARD ================= -->
    <aside
            class="panel players-panel"
            id="players-panel"
    >
      <h3 class="panel-title">
        🏆 Scoreboard
      </h3>

      <div
              class="player-list"
              id="player-list"
      ></div>
    </aside>


    <!-- ================= CANVAS AREA ================= -->
    <section class="canvas-area">

      <div class="canvas-frame">

        <canvas id="draw-canvas"></canvas>

        <div
                class="canvas-lock hidden"
                id="canvas-lock"
        >
          <span>
            👀 You're guessing — watch the artist draw!
          </span>
        </div>

      </div>


      <div
              class="toolbar"
              id="toolbar"
      >

        <div
                class="tool-group"
                id="tool-buttons"
        >
          <button
                  class="tool-btn active"
                  data-tool="brush"
                  title="Brush"
          >
            🖌
          </button>

          <button
                  class="tool-btn"
                  data-tool="pencil"
                  title="Pencil"
          >
            ✏️
          </button>

          <button
                  class="tool-btn"
                  data-tool="eraser"
                  title="Eraser"
          >
            🧹
          </button>
        </div>


        <div class="tool-group">

          <button
                  class="tool-btn"
                  id="btn-undo"
                  title="Undo"
          >
            ↩
          </button>

          <button
                  class="tool-btn"
                  id="btn-redo"
                  title="Redo"
          >
            ↪
          </button>

          <button
                  class="tool-btn"
                  id="btn-clear"
                  title="Clear canvas"
          >
            🗑
          </button>

        </div>


        <div class="tool-group brush-size-group">

          <span class="tool-label">
            Size
          </span>

          <input
                  type="range"
                  id="brush-size"
                  min="2"
                  max="36"
                  value="6"
          />

        </div>


        <div
                class="tool-group color-group"
                id="color-group"
        >
          <!-- populated by canvas.js -->
        </div>

      </div>

    </section>


    <!-- ================= CHAT / GUESS PANEL ================= -->
    <aside class="panel chat-panel">

      <h3 class="panel-title">
        💬 Chat &amp; Guesses
      </h3>

      <div
              class="chat-log"
              id="chat-log"
      ></div>

      <form
              class="chat-form"
              id="chat-form"
      >

        <input
                type="text"
                id="chat-input"
                placeholder="Type your guess…"
                maxlength="60"
                autocomplete="off"
        />

        <button
                type="submit"
                class="btn-icon btn-primary"
                aria-label="Send"
        >
          ➤
        </button>

      </form>

    </aside>

  </div>

</div>


<!-- ================= ROUND TRANSITION OVERLAY ================= -->
<div
        class="overlay hidden"
        id="round-overlay"
>

  <div class="paper-card overlay-card">

    <p class="overlay-eyebrow">
      Round Complete!
    </p>

    <h2 id="round-artist-line">
      🎨 — was the artist
    </h2>

    <p class="overlay-word">
      Word:
      <strong id="round-word-value">—</strong>
    </p>

    <div
            class="overlay-earners"
            id="round-earners"
    ></div>

    <p class="overlay-next">
      Next round starts in
      <span id="round-countdown">5</span>
    </p>

  </div>

</div>


<!-- ================= WINNER SCREEN OVERLAY ================= -->
<div
        class="overlay hidden"
        id="winner-overlay"
>

  <canvas id="confetti-canvas"></canvas>

  <div class="paper-card overlay-card winner-card">

    <p class="overlay-eyebrow">
      🏆 Game Over!
    </p>

    <div
            class="winner-crown"
            id="winner-crown"
    ></div>

    <div
            class="winner-list"
            id="winner-list"
    ></div>

    <div class="winner-actions">

      <button
              class="btn btn-primary"
              id="btn-play-again"
      >
        Play Again
      </button>

      <button
              class="btn btn-ghost"
              id="btn-exit-game"
      >
        Exit Game
      </button>

    </div>

  </div>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script src="js/websocket.js"></script>

<script src="js/canvas.js"></script>

<script src="js/chat.js"></script>

<script src="js/game.js"></script>

</body>
</html>
